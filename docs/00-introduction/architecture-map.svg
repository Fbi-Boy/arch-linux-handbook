<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Arch Linux Handbook architecture map</title>
<desc id="desc">Layered architecture from firmware and boot through kernel, storage, system services, hardware, desktop and applications.</desc>
<rect width="1200" height="720" rx="32" fill="#0b1220"/>
<text x="70" y="78" fill="#58b9ed" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="3">ARCH LINUX HANDBOOK</text>
<text x="70" y="120" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800">System architecture &amp; recovery layers</text>
<g font-family="Inter,Arial,sans-serif" font-weight="700" font-size="22">
<rect x="70" y="170" width="1060" height="66" rx="14" fill="#111827" stroke="#58b9ed"/><text x="600" y="212" text-anchor="middle" fill="#fff">Firmware / UEFI</text>
<path d="M600 236v24" stroke="#58b9ed" stroke-width="3"/><path d="M600 260l-9-13h18z" fill="#58b9ed"/>
<rect x="70" y="274" width="1060" height="66" rx="14" fill="#111827" stroke="#58b9ed"/><text x="600" y="316" text-anchor="middle" fill="#fff">EFI System Partition • Bootloader / UKI</text>
<path d="M600 340v24" stroke="#58b9ed" stroke-width="3"/><path d="M600 364l-9-13h18z" fill="#58b9ed"/>
<rect x="70" y="378" width="1060" height="66" rx="14" fill="#111827" stroke="#58b9ed"/><text x="600" y="420" text-anchor="middle" fill="#fff">Kernel • initramfs • microcode</text>
<path d="M600 444v24" stroke="#58b9ed" stroke-width="3"/><path d="M600 468l-9-13h18z" fill="#58b9ed"/>
<rect x="70" y="482" width="330" height="66" rx="14" fill="#111827" stroke="#58b9ed"/><text x="235" y="524" text-anchor="middle" fill="#fff">Storage / filesystem</text>
<rect x="435" y="482" width="330" height="66" rx="14" fill="#111827" stroke="#58b9ed"/><text x="600" y="524" text-anchor="middle" fill="#fff">systemd / services</text>
<rect x="800" y="482" width="330" height="66" rx="14" fill="#111827" stroke="#58b9ed"/><text x="965" y="524" text-anchor="middle" fill="#fff">Network / GPU / audio</text>
<path d="M600 548v24" stroke="#58b9ed" stroke-width="3"/><path d="M600 572l-9-13h18z" fill="#58b9ed"/>
<rect x="220" y="586" width="760" height="66" rx="14" fill="#1793d1"/><text x="600" y="628" text-anchor="middle" fill="#fff">Desktop • applications • user workflow</text>
</g>
