name: Documentation Site


permissions:
  contents: read

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "src/**"
      - "static/**"
      - "docusaurus.config.js"
      - "sidebars.js"
      - "package.json"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "static/**"
      - "docusaurus.config.js"
      - "sidebars.js"
      - "package.json"
      - ".github/workflows/site.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Build
        run: npm run build
