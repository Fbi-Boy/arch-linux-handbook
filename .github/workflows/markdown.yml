name: Documentation Quality


permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
          config: ".markdownlint-cli2.jsonc"
